name = "saathi-worker"
main = "src/index.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# Haiku keeps a step well under a rupee. If it misplaces the pointer on real apps,
# try claude-sonnet-5-5 or claude-opus-5-5 here.
GUIDE_MODEL = "claude-haiku-5-5"
GUIDE_EFFORT = "low"
DAILY_TURN_LIMIT = "300"

# Per-device daily counters. Create with: npx wrangler kv namespace create USAGE
[[kv_namespaces]]
binding = "USAGE"
id = "REPLACE_WITH_KV_ID"

# Answers shared between phones for non-personal screens (src/cache.ts). Optional.
# Create with: npx wrangler kv namespace create GUIDE_CACHE
[[kv_namespaces]]
binding = "GUIDE_CACHE"
id = "REPLACE_WITH_GUIDE_CACHE_KV_ID"

# Secrets (npx wrangler secret put <NAME>, or .dev.vars locally):
#   ANTHROPIC_API_KEY  TOKEN_SECRET
