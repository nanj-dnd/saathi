name = "saathi-worker"
main = "src/index.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]
# Served at https://saathi-worker.nanj-dnd.workers.dev. Per-version preview URLs stay off: they
# would keep every old version (including any without the spend cap) reachable.
workers_dev = true
preview_urls = false

[vars]
# Haiku keeps a step well under a rupee. If it misplaces the pointer on real apps,
# try claude-sonnet-5-5 or claude-opus-5-5 here.
GUIDE_MODEL = "claude-haiku-5-5"
GUIDE_EFFORT = "low"
DAILY_TURN_LIMIT = "300"
# Ceiling on model calls per day across every phone (src/spend.ts). ~3,000 Haiku calls ≈ $2/day.
GLOBAL_DAILY_LIMIT = "3000"
# Natural voice (src/speech.ts, Sarvam bulbul:v3). Lines are kept in SPEECH (src/speech-store.ts), so
# these limits count only new lines. 4,000 lines × ~80 characters ≈ 320k characters/day at most.
SPEECH_SPEAKER = "priya"
SPEECH_DAILY_LIMIT = "4000"
DEVICE_SPEECH_LIMIT = "400"

# Formerly per-device daily counters (now in SpendGuard). Kept bound so old data stays readable.
[[kv_namespaces]]
binding = "USAGE"
id = "3b489d9bc0b24d8d85907e18fab426b7"

# Answers shared between phones for non-personal screens (src/cache.ts). Optional.
# Create with: npx wrangler kv namespace create GUIDE_CACHE
[[kv_namespaces]]
binding = "GUIDE_CACHE"
id = "8ab0b8fd80a24796b91986bc0bcbb3ac"

# Secrets (npx wrangler secret put <NAME>, or .dev.vars locally):
#   ANTHROPIC_API_KEY  TOKEN_SECRET  SARVAM_API_KEY (optional: the natural voice)

# Exact global counter for GLOBAL_DAILY_LIMIT (src/spend.ts).
[[durable_objects.bindings]]
name = "SPEND"
class_name = "SpendGuard"

# The natural voice's shared cache (src/speech-store.ts): SQLite storage, 100,000 writes a day free.
[[durable_objects.bindings]]
name = "SPEECH"
class_name = "SpeechStore"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SpendGuard"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["SpeechStore"]
