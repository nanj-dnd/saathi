name: Bob
options:
  bundleIdPrefix: app.saathi.bob
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
    DEVELOPMENT_TEAM: F8AKJ93M9R
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: 1
    BOB_APP_GROUP: group.app.saathi.bob.ios
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  Bob:
    type: application
    platform: iOS
    sources: [Bob, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.saathi.bob.ios
        INFOPLIST_FILE: Bob/Info.plist
        CODE_SIGN_ENTITLEMENTS: Bob/Bob.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: BobBroadcast
        embed: true
  BobBroadcast:
    type: app-extension
    platform: iOS
    sources: [Broadcast, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.saathi.bob.ios.broadcast
        INFOPLIST_FILE: Broadcast/Info.plist
        CODE_SIGN_ENTITLEMENTS: Broadcast/Broadcast.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
  BobTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: Bob
schemes:
  Bob:
    build:
      targets:
        Bob: all
        BobTests: [test]
    test:
      targets: [BobTests]
